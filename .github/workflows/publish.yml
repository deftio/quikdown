name: Publish to npm

# Triggered by ci.yml after build passes, or manually for retries.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v1.2.7)'
        required: true
        type: string
      sha:
        description: 'Commit SHA to publish (defaults to tag ref if omitted)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.sha || github.event.inputs.tag }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build:all

    - name: Publish to npm (OIDC trusted publisher)
      run: npx -y npm@latest publish --provenance --access public

    - name: Create and push tag
      run: |
        TAG="${{ github.event.inputs.tag }}"
        if git ls-remote --tags origin "$TAG" | grep -q .; then
          echo "Tag $TAG already exists, skipping."
        else
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG."
        fi

  release:
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build:all

    - name: Build air-gapped zip bundle
      run: node tools/buildAirgapZip.cjs

    - name: Resolve air-gap zip path
      id: airgap
      run: echo "zip=dist/quikdown-airgap-v$(node -p 'require("./package.json").version').zip" >> "$GITHUB_OUTPUT"

    - name: Gzip standalone bundles
      run: gzip -9 -k -f dist/quikdown_edit_standalone.esm.min.js dist/quikdown_edit_standalone.umd.min.js

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.tag }}
        generate_release_notes: true
        files: |
          dist/quikdown.umd.min.js
          dist/quikdown.esm.min.js
          dist/quikdown.cjs
          dist/quikdown_bd.umd.min.js
          dist/quikdown_bd.esm.min.js
          dist/quikdown_edit.umd.min.js
          dist/quikdown_edit_standalone.esm.min.js
          dist/quikdown_edit_standalone.umd.min.js
          dist/quikdown_edit_standalone.esm.min.js.gz
          dist/quikdown_edit_standalone.umd.min.js.gz
          ${{ steps.airgap.outputs.zip }}
          dist/quikdown.light.min.css
          dist/quikdown.dark.min.css
          dist/quikdown.d.ts
          dist/quikdown_bd.d.ts
          dist/quikdown_edit.d.ts
          dist/quikdown_ast.d.ts
          dist/quikdown_json.d.ts
          dist/quikdown_yaml.d.ts
          dist/quikdown_ast_html.d.ts
          dist/quikdown_mcp.esm.js
          dist/quikdown_mcp.cjs
          dist/quikdown_mcp.d.ts
