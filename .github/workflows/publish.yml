name: Publish to npm

# Triggered by ci.yml after tagging, or manually for retries.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.2.7)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci

    - name: Build project (core + standalone offline editor)
      run: npm run build:all

    - name: Release verification (standalone + npm pack)
      run: npm run verify:release

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Standalone editor smoke (Playwright)
      run: npm run test:standalone:e2e

    - name: Run unit tests
      run: npm test

    - name: Publish to npm (OIDC trusted publisher)
      run: npx -y npm@latest publish --provenance --access public

  release:
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci

    - name: Build project (dist files for release assets)
      run: npm run build:all

    - name: Build air-gapped zip bundle
      run: node tools/buildAirgapZip.cjs

    - name: Resolve air-gap zip path
      id: airgap
      run: echo "zip=dist/quikdown-airgap-v$(node -p 'require("./package.json").version').zip" >> "$GITHUB_OUTPUT"

    - name: Gzip standalone bundles
      run: gzip -9 -k dist/quikdown_edit_standalone.esm.min.js dist/quikdown_edit_standalone.umd.min.js

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag }}
        generate_release_notes: true
        files: |
          dist/quikdown.umd.min.js
          dist/quikdown.esm.min.js
          dist/quikdown.cjs
          dist/quikdown_bd.umd.min.js
          dist/quikdown_bd.esm.min.js
          dist/quikdown_edit.umd.min.js
          dist/quikdown_edit_standalone.esm.min.js
          dist/quikdown_edit_standalone.umd.min.js
          dist/quikdown_edit_standalone.esm.min.js.gz
          dist/quikdown_edit_standalone.umd.min.js.gz
          ${{ steps.airgap.outputs.zip }}
          dist/quikdown.light.min.css
          dist/quikdown.dark.min.css
